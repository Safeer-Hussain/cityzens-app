name: Cityzens CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Analyze & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Engine (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false # CRITICAL: keep cache false so runners never stall

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Hygiene & Static Analysis
        run: flutter analyze

      - name: Execute Full Test Suite with Coverage
        run: flutter test --coverage
